<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1a2e">
  <title>退休倒數計時器 · 2039/01/01</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 左上角：版本 + 排版模式 -->
  <div class="version-text" id="versionText">v2.8.1 Mobile</div>

  <div class="card">
    <h1>⏳ 退休倒數</h1>
    <div class="target-date">2039年1月1日 · 退休日</div>

    <!-- 統一寬度容器：天、時分秒、年齡三排都在裡面，寬度永遠一致 -->
    <div class="grid-container">
      <!-- 第一排：天 -->
      <div class="row">
        <div class="time-block days-block">
          <div class="time-value" id="days">--</div>
          <div class="time-label">天</div>
        </div>
      </div>
      <!-- 第二排：時、分、秒 -->
      <div class="row">
        <div class="time-block">
          <div class="time-value" id="hours">--</div>
          <div class="time-label">小時</div>
        </div>
        <div class="time-block">
          <div class="time-value" id="minutes">--</div>
          <div class="time-label">分鐘</div>
        </div>
        <div class="time-block">
          <div class="time-value" id="seconds">--</div>
          <div class="time-label">秒</div>
        </div>
      </div>
      <!-- 第三排：年齡（與上面兩排同寬） -->
      <div class="age-section">
        <div class="age-item">
          <div class="age-label">現在年齡</div>
          <div class="age-value" id="currentAge">31</div>
          <div class="age-note">(1994/11/25 出生)</div>
        </div>
        <div class="age-item">
          <div class="age-label">退休時年齡</div>
          <div class="age-value" id="retireAge">44</div>
          <div class="age-note">(2039/01/01)</div>
        </div>
      </div>
    </div>

    <div class="message" id="message">
      距離退休還有 <strong>--</strong> 天
    </div>
    <div class="footnote">⏱️ 倒數自動更新 · 每秒刷新</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
