<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>退休倒數計時器 · 2039/01/01</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(145deg, #0b1a2e 0%, #1b2f48 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
      margin: 0;
    }

    .card {
      background: rgba(18, 30, 48, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 3.5rem;
      padding: 2.8rem 2.5rem;
      box-shadow: 0 30px 45px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 120, 0.2) inset;
      max-width: 820px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255, 210, 120, 0.25);
      transition: all 0.2s ease;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 500;
      letter-spacing: 2px;
      color: #f5e7c8;
      text-shadow: 0 4px 12px rgba(255, 200, 80, 0.3);
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    h1 span {
      font-size: 1.7rem;
      background: rgba(255, 220, 130, 0.12);
      padding: 0.15rem 1rem;
      border-radius: 60px;
      font-weight: 400;
      color: #ffd966;
      letter-spacing: 1px;
    }

    .target-date {
      color: #aac8e4;
      font-size: 0.95rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 2rem;
      font-weight: 300;
      border-bottom: 1px dashed rgba(255, 220, 140, 0.4);
      padding-bottom: 1rem;
      display: inline-block;
    }

    .countdown-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.9rem;
      margin-bottom: 2.2rem;
    }

    .time-block {
      background: #0d1a27;
      border-radius: 1.8rem;
      padding: 0.8rem 0.4rem;
      min-width: 85px;
      flex: 1 1 85px;
      box-shadow: 0 12px 18px -8px black, 0 0 0 1px rgba(255, 210, 120, 0.2);
      border-bottom: 3px solid #ffbe4d;
    }

    /* 特別加寬「天」的框框，容納4~5位數字 */
    .time-block.days-block {
      min-width: 150px;
      flex: 1.6 1 150px;
      max-width: 220px;
    }

    .time-value {
      font-size: 2.6rem;
      font-weight: 800;
      color: #ffe9b6;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 12px #f0b34b;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .time-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #92adc9;
      margin-top: 0.4rem;
      font-weight: 400;
    }

    .age-section {
      display: flex;
      justify-content: center;
      gap: 1.8rem;
      flex-wrap: wrap;
      background: rgba(10, 20, 30, 0.7);
      border-radius: 60px;
      padding: 1rem 1.5rem;
      margin-bottom: 1rem;
      border: 1px solid rgba(255, 200, 100, 0.3);
    }

    .age-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .age-label {
      font-size: 0.8rem;
      color: #b8cfec;
      letter-spacing: 1px;
      margin-bottom: 0.2rem;
    }

    .age-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffd966;
      background: #162433;
      padding: 0.3rem 1.2rem;
      border-radius: 50px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.7), 0 0 0 1px #b88c3a;
      line-height: 1.2;
    }

    .age-note {
      font-size: 0.75rem;
      color: #97b3d0;
      margin-top: 0.2rem;
      font-style: italic;
    }

    .message {
      font-size: 1rem;
      color: #c9dbf0;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 210, 120, 0.3);
      letter-spacing: 0.5px;
      font-weight: 300;
    }

    .message strong {
      color: #ffd966;
      font-weight: 600;
      font-size: 1.2rem;
    }

    .footnote {
      margin-top: 1.5rem;
      font-size: 0.7rem;
      color: #6e8aa8;
      letter-spacing: 0.5px;
    }

    /* 小屏幕進一步縮小 */
    @media (max-width: 650px) {
      .card {
        padding: 2rem 1.2rem;
        border-radius: 2rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      h1 span {
        font-size: 1.3rem;
      }
      .target-date {
        font-size: 0.8rem;
      }
      .countdown-grid {
        gap: 0.6rem;
      }
      .time-block {
        min-width: 65px;
        padding: 0.6rem 0.2rem;
      }
      .time-block.days-block {
        min-width: 120px;
        flex: 1.6 1 120px;
        max-width: 180px;
      }
      .time-value {
        font-size: 1.9rem;
      }
      .time-label {
        font-size: 0.6rem;
        letter-spacing: 1px;
      }
      .age-section {
        gap: 1rem;
        padding: 0.8rem 0.8rem;
      }
      .age-value {
        font-size: 1.4rem;
        padding: 0.2rem 0.9rem;
      }
      .age-label {
        font-size: 0.7rem;
      }
      .age-note {
        font-size: 0.65rem;
      }
      .message {
        font-size: 0.9rem;
      }
      .message strong {
        font-size: 1rem;
      }
    }

    @media (max-width: 420px) {
      .time-value {
        font-size: 1.5rem;
      }
      .time-block {
        min-width: 55px;
      }
      .time-block.days-block {
        min-width: 100px;
        flex: 1.6 1 100px;
        max-width: 150px;
      }
      .age-value {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>
      ⏳ 退休倒數
      <span>2039</span>
    </h1>
    <div class="target-date">2039年1月1日 · 退休日</div>

    <!-- 倒數計時區塊 -->
    <div class="countdown-grid" id="countdown">
      <div class="time-block days-block">
        <div class="time-value" id="days">--</div>
        <div class="time-label">天</div>
      </div>
      <div class="time-block">
        <div class="time-value" id="hours">--</div>
        <div class="time-label">小時</div>
      </div>
      <div class="time-block">
        <div class="time-value" id="minutes">--</div>
        <div class="time-label">分鐘</div>
      </div>
      <div class="time-block">
        <div class="time-value" id="seconds">--</div>
        <div class="time-label">秒</div>
      </div>
    </div>

    <!-- 年齡顯示 -->
    <div class="age-section">
      <div class="age-item">
        <div class="age-label">現在年齡</div>
        <div class="age-value" id="currentAge">32</div>
        <div class="age-note">(1993/11/25 出生)</div>
      </div>
      <div class="age-item">
        <div class="age-label">退休時年齡</div>
        <div class="age-value" id="retireAge">44</div>
        <div class="age-note">(2039/01/01)</div>
      </div>
    </div>

    <div class="message" id="message">
      距離退休還有 <strong>--</strong> 天
    </div>
    <div class="footnote">⏱️ 倒數自動更新 · 每10毫秒刷新</div>
  </div>

  <script>
    (function() {
      // 清除可能存在的舊計時器
      if (window._retirementTimer) {
        clearInterval(window._retirementTimer);
        window._retirementTimer = null;
      }

      // 設定目標退休日期：2039年1月1日 00:00:00
      const RETIREMENT_DATE = new Date(2039, 0, 1, 0, 0, 0);
      // 出生日期：1993年11月25日
      const BIRTH_DATE = new Date(1993, 10, 25);

      // DOM 元素
      const daysEl = document.getElementById('days');
      const hoursEl = document.getElementById('hours');
      const minutesEl = document.getElementById('minutes');
      const secondsEl = document.getElementById('seconds');
      const currentAgeEl = document.getElementById('currentAge');
      const retireAgeEl = document.getElementById('retireAge');
      const messageEl = document.getElementById('message');

      // 計算年齡
      function calculateAge(birthDate, referenceDate) {
        const birthYear = birthDate.getFullYear();
        const birthMonth = birthDate.getMonth();
        const birthDay = birthDate.getDate();

        const refYear = referenceDate.getFullYear();
        const refMonth = referenceDate.getMonth();
        const refDay = referenceDate.getDate();

        let age = refYear - birthYear;
        if (refMonth < birthMonth || (refMonth === birthMonth && refDay < birthDay)) {
          age--;
        }
        return age;
      }

      // 更新年齡
      function updateAges() {
        const now = new Date();
        currentAgeEl.textContent = calculateAge(BIRTH_DATE, now);
        retireAgeEl.textContent = calculateAge(BIRTH_DATE, RETIREMENT_DATE);
      }

      // 更新倒數
      function updateCountdown() {
        const now = new Date();
        let diff = RETIREMENT_DATE - now;

        if (diff <= 0) {
          daysEl.textContent = '0';
          hoursEl.textContent = '0';
          minutesEl.textContent = '0';
          secondsEl.textContent = '0';
          messageEl.innerHTML = `🎉 您已經退休了！享受人生吧！`;
          return;
        }

        const msPerSecond = 1000;
        const msPerMinute = 60 * msPerSecond;
        const msPerHour = 60 * msPerMinute;
        const msPerDay = 24 * msPerHour;

        const days = Math.floor(diff / msPerDay);
        diff -= days * msPerDay;

        const hours = Math.floor(diff / msPerHour);
        diff -= hours * msPerHour;

        const minutes = Math.floor(diff / msPerMinute);
        diff -= minutes * msPerMinute;

        const seconds = Math.floor(diff / msPerSecond);

        // 動態調整天數的字體大小，避免5位數時溢出（雖然框已加寬，但雙重保險）
        const daysStr = days.toString();
        if (daysStr.length >= 5) {
          daysEl.style.fontSize = '2rem';
        } else if (daysStr.length === 4) {
          daysEl.style.fontSize = '2.4rem';
        } else {
          daysEl.style.fontSize = ''; // 恢復CSS設定
        }

        daysEl.textContent = days;
        hoursEl.textContent = String(hours).padStart(2, '0');
        minutesEl.textContent = String(minutes).padStart(2, '0');
        secondsEl.textContent = String(seconds).padStart(2, '0');

        const totalDays = Math.ceil((RETIREMENT_DATE - now) / msPerDay);
        messageEl.innerHTML = `距離退休還有 <strong>${totalDays.toLocaleString()}</strong> 天`;
      }

      function updateAll() {
        updateCountdown();
        updateAges();
      }

      // 初始化
      updateAll();

      // 設定計時器
      window._retirementTimer = setInterval(updateAll, 10);
    })();
  </script>
</body>
</html>
