<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1a2e">
  <title>自訂倒數計時器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: #0b1a2e;
      height: 100%;
    }

    /* ---------- Mobile-First 基礎（手機樣式） ---------- */
    body {
      background: linear-gradient(145deg, #0b1a2e 0%, #1b2f48 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
      padding: max(2rem, env(safe-area-inset-top) + 1rem)
               max(0.8rem, env(safe-area-inset-right))
               max(0.8rem, env(safe-area-inset-bottom))
               max(0.8rem, env(safe-area-inset-left));
      margin: 0;
      overflow-x: hidden;
      position: relative;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---------- 左上角版本與排版文字 ---------- */
    .version-text {
      position: absolute;
      top: max(0.6rem, env(safe-area-inset-top) + 0.4rem);
      left: max(0.6rem, env(safe-area-inset-left) + 0.4rem);
      z-index: 9999;
      font-size: 0.65rem;
      letter-spacing: 1px;
      color: #ffffff;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      user-select: none;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
    }

    .card {
      background: rgba(18, 30, 48, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 1.6rem;
      padding: 1.4rem 1.1rem;
      box-shadow: 0 30px 45px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 120, 0.2) inset;
      max-width: 820px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255, 210, 120, 0.25);
      transition: all 0.2s ease;
      margin-top: 0;
      touch-action: manipulation;
      max-height: calc(100dvh - 2rem);
      display: flex;
      flex-direction: column;
    }

    /* ---------- 分頁切換列 (Tabs) ---------- */
    .tabs-container {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.8rem;
      margin-bottom: 0.5rem;
      border-bottom: 1px solid rgba(255, 210, 120, 0.2);
      scrollbar-width: none;
    }
    .tabs-container::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      background: rgba(13, 26, 39, 0.7);
      border: 1px solid rgba(255, 210, 120, 0.3);
      border-radius: 0.6rem;
      color: #92adc9;
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      user-select: none;
    }

    .tab-btn.active {
      background: rgba(255, 190, 77, 0.15);
      border-color: #ffbe4d;
      color: #ffd966;
      font-weight: 700;
    }

    .tab-close {
      color: #ff9b9b;
      font-weight: 700;
      padding: 0 4px;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      border-radius: 50%;
      transition: background 0.1s;
      display: inline-block;
    }
    .tab-close:hover {
      color: #ff5c5c;
      background: rgba(255, 92, 92, 0.15);
    }

    /* ---------- 標題區 ---------- */
    .target-date {
      color: #aac8e4;
      font-size: 0.78rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
      font-weight: 300;
      border-bottom: 1px dashed rgba(255, 220, 140, 0.4);
      padding-bottom: 0.7rem;
      display: inline-block;
    }

    .countdown-title {
      font-size: 1.1rem;
      font-weight: 500;
      color: #f5e7c8;
      text-shadow: 0 4px 12px rgba(255, 200, 80, 0.3);
      margin-bottom: 0.8rem;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* ---------- 統一寬度容器 ---------- */
    .grid-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin-bottom: 0.5rem;
    }

    .row {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 0.85rem;
    }

    .time-block {
      background: #0d1a27;
      border-radius: 1rem;
      padding: 0.7rem 0.25rem;
      flex: 1 1 0;
      min-width: 0;
      box-shadow: 0 12px 18px -8px black, 0 0 0 1px rgba(255, 210, 120, 0.2);
      border-bottom: 3px solid #ffbe4d;
    }

    .time-block.days-block {
      flex: 1 1 100%;
    }

    .time-value {
      font-size: 1.7rem;
      font-weight: 800;
      color: #ffe9b6;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 12px #f0b34b;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .time-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #92adc9;
      margin-top: 0.3rem;
      font-weight: 400;
    }

    /* ---------- 年齡區塊 ---------- */
    .age-section {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 1rem;
      background: rgba(10, 20, 30, 0.7);
      border-radius: 1.5rem;
      padding: 7px 0.8rem; 
      border: 1px solid rgba(255, 200, 100, 0.3);
    }

    .age-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1 1 0;
      min-width: 0;
    }

    .age-label {
      font-size: 0.7rem;
      color: #b8cfec;
      letter-spacing: 0.8px;
      margin-bottom: 0.3rem;
    }

    .age-value {
      font-size: 1.2rem;
      padding: 2px 0.8rem;
      font-weight: 700;
      color: #ffd966;
      background: #162433;
      border-radius: 50px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.7), 0 0 0 1px #b88c3a;
      line-height: 1.2;
    }

    .age-note {
      font-size: 0.65rem;
      color: #97b3d0;
      margin-top: 0.3rem;
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* ---------- 訊息與按鈕 ---------- */
    .message {
      font-size: 0.85rem;
      color: #c9dbf0;
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(255, 210, 120, 0.3);
      letter-spacing: 0.3px;
      font-weight: 300;
    }

    .message strong {
      color: #ffd966;
      font-weight: 600;
      font-size: 1rem;
    }

    .settings {
      margin-top: 0.6rem;
      padding-top: 0.5rem;
      border-top: 1px dashed rgba(255, 220, 140, 0.3);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .settings-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 0.55rem 0.6rem;
      background: rgba(13, 26, 39, 0.7);
      border: 1px solid rgba(255, 210, 120, 0.3);
      border-radius: 0.7rem;
      color: #f5e7c8;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.8px;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.15s ease;
    }

    .settings-toggle:active {
      background: rgba(255, 190, 77, 0.15);
    }

    .btn-create {
      color: #7ee0a1;
      border-color: rgba(126, 224, 161, 0.4);
    }
    .btn-create:active {
      background: rgba(126, 224, 161, 0.15);
    }

    .footnote {
      margin-top: 0.6rem;
      font-size: 0.6rem;
      color: #6e8aa8;
      letter-spacing: 0.3px;
    }

    /* ---------- 彈出式視窗 ---------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: #121e30;
      border: 1px solid rgba(255, 210, 120, 0.35);
      border-radius: 1.4rem;
      padding: 1.4rem 1.2rem;
      width: 100%;
      max-width: 340px;
      max-height: 90dvh;
      overflow-y: auto;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 215, 120, 0.15) inset;
      touch-action: manipulation;
    }

    .modal-title {
      font-size: 1rem;
      color: #f5e7c8;
      font-weight: 600;
      letter-spacing: 1px;
      text-align: center;
      margin-bottom: 1rem;
    }

    .modal-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      margin-bottom: 0.7rem;
      flex-wrap: wrap;
    }

    .modal-row label {
      font-size: 0.8rem;
      color: #b8cfec;
      letter-spacing: 0.3px;
      flex: 0 0 auto;
    }

    .modal-row input[type="text"],
    .modal-row input[type="date"],
    .modal-row select {
      flex: 1 1 auto;
      min-width: 130px;
      max-width: 100%;
      background: #0d1a27;
      border: 1px solid rgba(255, 210, 120, 0.35);
      border-radius: 0.6rem;
      padding: 0.45rem 0.6rem;
      color: #ffe9b6;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      touch-action: manipulation;
    }

    .modal-row input:focus,
    .modal-row select:focus {
      border-color: #ffbe4d;
      box-shadow: 0 0 0 2px rgba(255, 190, 77, 0.25);
    }

    .time-selects {
      display: flex;
      gap: 0.4rem;
      flex: 1 1 auto;
    }
    
    .time-selects select {
      flex: 1;
      min-width: 60px;
      padding: 0.45rem 0.4rem;
    }

    .modal-actions {
      display: flex;
      gap: 0.6rem;
      margin-top: 1rem;
    }

    .modal-actions button {
      flex: 1 1 0;
      padding: 0.6rem 0.8rem;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      border: none;
      border-radius: 0.7rem;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }

    .modal-actions .btn-cancel {
      background: rgba(255, 255, 255, 0.08);
      color: #c9dbf0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .modal-actions .btn-cancel:active {
      background: rgba(255, 255, 255, 0.15);
    }

    .modal-actions .btn-apply {
      background: linear-gradient(145deg, #ffbe4d, #e6a32e);
      color: #0b1a2e;
      box-shadow: 0 8px 18px -8px rgba(255, 190, 77, 0.6);
    }

    .modal-actions .btn-apply:active {
      transform: translateY(1px);
      box-shadow: 0 4px 10px -6px rgba(255, 190, 77, 0.5);
    }

    .settings-hint {
      margin-top: 0.6rem;
      font-size: 0.72rem;
      color: #97b3d0;
      text-align: center;
      min-height: 1em;
    }

    .settings-hint.error {
      color: #ff9b9b;
    }

    .settings-hint.success {
      color: #7ee0a1;
    }

    .hidden {
      display: none !important;
    }

    /* ---------- 平板 / 桌面 ---------- */
    @media (min-width: 600px) {
      body {
        padding: 3rem 1.5rem 1.5rem;
        touch-action: auto;
      }
      .card {
        touch-action: auto;
        border-radius: 2.5rem;
        padding: 2rem 2rem;
        max-height: none;
      }
      .tabs-container {
        gap: 0.8rem;
        padding-bottom: 1rem;
      }
      .tab-btn {
        font-size: 0.95rem;
        padding: 0.5rem 1rem;
      }
      .tab-close {
        font-size: 1.1rem;
      }
      .target-date {
        font-size: 0.88rem;
        letter-spacing: 2px;
        margin-bottom: 1.2rem;
        padding-bottom: 0.9rem;
      }
      .countdown-title {
        font-size: 1.5rem;
        margin-bottom: 1.2rem;
        letter-spacing: 1.5px;
      }
      .grid-container {
        gap: 1.1rem;
        margin-bottom: 0.8rem;
      }
      .row {
        gap: 1.1rem;
      }
      .time-block {
        border-radius: 1.4rem;
        padding: 0.9rem 0.35rem;
      }
      .time-value {
        font-size: 2.2rem;
        letter-spacing: 0.8px;
      }
      .time-label {
        font-size: 0.68rem;
        letter-spacing: 1.5px;
        margin-top: 0.35rem;
      }
      .age-section {
        gap: 1.2rem;
        border-radius: 2rem;
        padding: 1rem 1.2rem;
      }
      .age-label {
        font-size: 0.75rem;
      }
      .age-value {
        font-size: 1.5rem;
        padding: 0.2rem 1rem;
      }
      .age-note {
        font-size: 0.7rem;
      }
      .message {
        font-size: 0.95rem;
        margin-top: 0.8rem;
        padding-top: 0.7rem;
      }
      .message strong {
        font-size: 1.1rem;
      }
      .settings {
        margin-top: 0.8rem;
        padding-top: 0.7rem;
      }
      .settings-toggle {
        font-size: 0.9rem;
        padding: 0.65rem 0.8rem;
      }
      .footnote {
        margin-top: 0.8rem;
        font-size: 0.65rem;
      }
      .version-text {
        font-size: 0.75rem;
        letter-spacing: 1.2px;
        top: max(1rem, env(safe-area-inset-top) + 0.5rem);
        left: max(1rem, env(safe-area-inset-left) + 0.5rem);
      }
      .modal {
        max-width: 380px;
        padding: 1.8rem 1.6rem;
      }
      .modal-title {
        font-size: 1.15rem;
      }
      .modal-row label {
        font-size: 0.9rem;
      }
      .modal-row input[type="text"],
      .modal-row input[type="date"],
      .modal-row select {
        font-size: 0.95rem;
        padding: 0.55rem 0.7rem;
      }
      .modal-actions button {
        font-size: 0.95rem;
        padding: 0.7rem 1rem;
      }
    }

    /* 極窄螢幕（320px 左右）再保險 */
    @media (max-width: 340px) {
      .card {
        padding: 1rem 0.7rem;
      }
      .countdown-title {
        font-size: 1rem;
        margin-bottom: 0.6rem;
      }
      .time-value {
        font-size: 1.4rem;
      }
      .time-label {
        font-size: 0.6rem;
      }
      .age-value {
        font-size: 1.2rem;
      }
      .age-label, .age-note {
        font-size: 0.58rem;
      }
      .version-text {
        font-size: 0.55rem;
        top: max(0.4rem, env(safe-area-inset-top) + 0.2rem);
        left: max(0.4rem, env(safe-area-inset-left) + 0.2rem);
      }
      .modal-row {
        flex-direction: column;
        align-items: stretch;
      }
      .modal-row label {
        margin-bottom: 0.15rem;
      }
    }
  </style>
</head>
<body>
  <!-- 左上角：版本 + 排版模式 -->
  <div class="version-text" id="versionText">v3.7.1 Mobile</div>

  <div class="card">
    
    <!-- 分頁切換列 -->
    <div class="tabs-container" id="tabsContainer">
      <!-- 分頁由 JS 動態生成 -->
    </div>

    <!-- 顯示當前選中時鐘的日期 -->
    <div class="target-date" id="targetDateDisplay">2039年1月1日 · 退休日</div>

    <!-- 顯示當前選中時鐘的標題 -->
    <div class="countdown-title" id="countdownTitle">⏳ 距離退休倒數...</div>

    <!-- 倒數計時區塊 (天、時、分、秒) -->
    <div class="grid-container">
      <!-- 第一排：天 -->
      <div class="row">
        <div class="time-block days-block">
          <div class="time-value" id="days">--</div>
          <div class="time-label">天</div>
        </div>
      </div>
      <!-- 第二排：時、分、秒 -->
      <div class="row">
        <div class="time-block">
          <div class="time-value" id="hours">--</div>
          <div class="time-label">小時</div>
        </div>
        <div class="time-block">
          <div class="time-value" id="minutes">--</div>
          <div class="time-label">分鐘</div>
        </div>
        <div class="time-block">
          <div class="time-value" id="seconds">--</div>
          <div class="time-label">秒</div>
        </div>
      </div>
      <!-- 第三排：年齡 -->
      <div class="age-section" id="ageSection">
        <div class="age-item">
          <div class="age-label">現在年齡</div>
          <div class="age-value" id="currentAge">--</div>
          <div class="age-note" id="birthNote">(1994/11/25 出生)</div>
        </div>
        <div class="age-item">
          <div class="age-label">退休時年齡</div>
          <div class="age-value" id="retireAge">--</div>
          <div class="age-note" id="retireNote">(2039/01/01)</div>
        </div>
      </div>
    </div>

    <div class="message" id="message">距離退休倒數還有 <strong>--</strong> 天</div>

    <!-- 按鈕區 -->
    <div class="settings">
      <button class="settings-toggle" id="editBtn" type="button">
        ⚙️ 修改時鐘
      </button>
      <button class="settings-toggle btn-create" id="createBtn" type="button">
        ➕ 新增時鐘
      </button>
    </div>

    <div class="footnote">⏱️ 倒數自動刷新</div>
  </div>

  <!-- 彈出式視窗：設定時鐘 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-title" id="modalTitle">⚙️ 設定時鐘</div>
      
      <!-- 時鐘類型 -->
      <div class="modal-row" id="typeRow">
        <label for="typeInput">時鐘類型</label>
        <select id="typeInput">
          <option value="custom">自訂</option>
          <option value="retirement">退休倒數</option>
          <option value="recurring">重複日期</option>
        </select>
      </div>

      <!-- 時鐘名稱 (自訂與重複時顯示) -->
      <div class="modal-row" id="nameRow">
        <label for="nameInput">時鐘名稱</label>
        <input type="text" id="nameInput" placeholder="例如：出糧" maxlength="10">
      </div>
      
      <!-- 目標日期 (自訂與退休時顯示) -->
      <div class="modal-row" id="dateRow">
        <label for="targetInput">目標日期</label>
        <input type="date" id="targetInput">
      </div>
      
      <!-- 目標時間 (自訂與退休時顯示) -->
      <div class="modal-row" id="timeRow">
        <label>目標時間</label>
        <div class="time-selects">
          <select id="hourInput"></select>
          <select id="minuteInput"></select>
        </div>
      </div>
      
      <!-- 出生日期 (退休時顯示) -->
      <div class="modal-row hidden" id="birthRow">
        <label for="birthInput">出生日期</label>
        <input type="date" id="birthInput">
      </div>

      <!-- 👇 以下為重複日期專屬欄位 👇 -->
      <div class="modal-row hidden" id="recurringFreqRow">
        <label for="recurringFreqInput">重複頻率</label>
        <select id="recurringFreqInput">
          <option value="daily">每日</option>
          <option value="yearly">每年</option>
          <option value="monthly">每月</option>
          <option value="weekly">每星期</option>
        </select>
      </div>

      <div class="modal-row hidden" id="recurringValueRow">
        <label id="recurringValueLabel">設定值</label>
        <select id="recurringValueInput"></select>
      </div>

      <div class="modal-row hidden" id="recurringTimeRow">
        <label>目標時間</label>
        <div class="time-selects">
          <select id="recurringHourInput"></select>
          <select id="recurringMinuteInput"></select>
        </div>
      </div>
      <!-- 👆 重複日期專屬欄位結束 👆 -->
      
      <div class="settings-hint" id="settingsHint"></div>
      
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelBtn" type="button">取消</button>
        <button class="btn-apply" id="applyBtn" type="button">套用</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const VERSION = 'v3.7.1';

      // ================== 狀態資料 ==================
      const defaultRetirement = {
        id: 'retirement',
        name: '退休倒數',
        targetDate: new Date(2039, 0, 1, 0, 0, 0),
        birthDate: new Date(1994, 10, 25),
        type: 'retirement',
        isDefault: true
      };

      let clocks = [
        { ...defaultRetirement }
      ];

      let activeId = 'retirement';

      // ================== DOM 元素 ==================
      const versionTextEl = document.getElementById('versionText');
      const tabsContainer = document.getElementById('tabsContainer');
      
      const targetDateDisplayEl = document.getElementById('targetDateDisplay');
      const countdownTitleEl = document.getElementById('countdownTitle');
      
      const daysEl = document.getElementById('days');
      const hoursEl = document.getElementById('hours');
      const minutesEl = document.getElementById('minutes');
      const secondsEl = document.getElementById('seconds');
      
      const ageSection = document.getElementById('ageSection');
      const currentAgeEl = document.getElementById('currentAge');
      const retireAgeEl = document.getElementById('retireAge');
      const birthNoteEl = document.getElementById('birthNote');
      const retireNoteEl = document.getElementById('retireNote');
      
      const messageEl = document.getElementById('message');
      
      const editBtn = document.getElementById('editBtn');
      const createBtn = document.getElementById('createBtn');
      
      const modalOverlay = document.getElementById('modalOverlay');
      const modalTitle = document.getElementById('modalTitle');
      
      const typeRow = document.getElementById('typeRow');
      const typeInput = document.getElementById('typeInput');
      
      const nameRow = document.getElementById('nameRow');
      const nameInput = document.getElementById('nameInput');
      
      // 一般日期時間
      const dateRow = document.getElementById('dateRow');
      const targetInput = document.getElementById('targetInput');
      const timeRow = document.getElementById('timeRow');
      const hourInput = document.getElementById('hourInput');
      const minuteInput = document.getElementById('minuteInput');
      
      // 退休專屬
      const birthRow = document.getElementById('birthRow');
      const birthInput = document.getElementById('birthInput');
      
      // 重複日期專屬
      const recurringFreqRow = document.getElementById('recurringFreqRow');
      const recurringFreqInput = document.getElementById('recurringFreqInput');
      const recurringValueRow = document.getElementById('recurringValueRow');
      const recurringValueLabel = document.getElementById('recurringValueLabel');
      const recurringValueInput = document.getElementById('recurringValueInput');
      const recurringTimeRow = document.getElementById('recurringTimeRow');
      const recurringHourInput = document.getElementById('recurringHourInput');
      const recurringMinuteInput = document.getElementById('recurringMinuteInput');
      
      const settingsHint = document.getElementById('settingsHint');
      const cancelBtn = document.getElementById('cancelBtn');
      const applyBtn = document.getElementById('applyBtn');

      let modalMode = 'edit';

      // ================== 初始化選單 ==================
      function initSelects() {
        // 時、分
        for (let i = 0; i < 24; i++) {
          const opt = document.createElement('option');
          opt.value = i;
          opt.textContent = String(i).padStart(2, '0');
          hourInput.appendChild(opt);
        }
        for (let i = 0; i < 60; i++) {
          const opt = document.createElement('option');
          opt.value = i;
          opt.textContent = String(i).padStart(2, '0');
          minuteInput.appendChild(opt);
        }
        
        // 重複日期的時、分
        for (let i = 0; i < 24; i++) {
          const opt = document.createElement('option');
          opt.value = i;
          opt.textContent = String(i).padStart(2, '0');
          recurringHourInput.appendChild(opt);
        }
        for (let i = 0; i < 60; i++) {
          const opt = document.createElement('option');
          opt.value = i;
          opt.textContent = String(i).padStart(2, '0');
          recurringMinuteInput.appendChild(opt);
        }
      }
      initSelects();

      // 更新重複頻率的設定值選單
      function updateRecurringValues() {
        const freq = recurringFreqInput.value;
        
        if (freq === 'daily') {
          recurringValueRow.classList.add('hidden');
          recurringValueInput.innerHTML = '';
          return;
        }
        
        recurringValueRow.classList.remove('hidden');
        recurringValueInput.innerHTML = '';

        if (freq === 'yearly') {
          recurringValueLabel.textContent = '幾月幾日';
          for (let m = 1; m <= 12; m++) {
            for (let d = 1; d <= 31; d++) {
              const opt = document.createElement('option');
              opt.value = `${m}-${d}`;
              opt.textContent = `${m}月${d}日`;
              recurringValueInput.appendChild(opt);
            }
          }
        } else if (freq === 'monthly') {
          recurringValueLabel.textContent = '幾號';
          for (let d = 1; d <= 31; d++) {
            const opt = document.createElement('option');
            opt.value = d;
            opt.textContent = `${d}號`;
            recurringValueInput.appendChild(opt);
          }
        } else if (freq === 'weekly') {
          recurringValueLabel.textContent = '星期幾';
          const days = ['日', '一', '二', '三', '四', '五', '六'];
          for (let i = 0; i < 7; i++) {
            const opt = document.createElement('option');
            opt.value = i; // 0 is Sunday
            opt.textContent = `星期${days[i]}`;
            recurringValueInput.appendChild(opt);
          }
        }
      }

      recurringFreqInput.addEventListener('change', updateRecurringValues);

      // ================== 工具函數 ==================
      function updateVersionText() {
        const isDesktop = window.matchMedia('(min-width: 600px)').matches;
        const mode = isDesktop ? 'Desktop' : 'Mobile';
        versionTextEl.textContent = `${VERSION} ${mode}`;
      }
      updateVersionText();
      window.addEventListener('resize', updateVersionText);
      window.matchMedia('(min-width: 600px)').addEventListener('change', updateVersionText);

      function pad2(n) {
        return String(n).padStart(2, '0');
      }

      function toInputDateString(date) {
        return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
      }

      function toDisplayDateString(date) {
        return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
      }

      function toNoteDateString(date) {
        return `${date.getFullYear()}/${pad2(date.getMonth() + 1)}/${pad2(date.getDate())}`;
      }

      function calculateAge(birthDate, referenceDate) {
        const birthYear = birthDate.getFullYear();
        const birthMonth = birthDate.getMonth();
        const birthDay = birthDate.getDate();

        const refYear = referenceDate.getFullYear();
        const refMonth = referenceDate.getMonth();
        const refDay = referenceDate.getDate();

        let age = refYear - birthYear;
        if (refMonth < birthMonth || (refMonth === birthMonth && refDay < birthDay)) {
          age--;
        }
        return age;
      }

      // 計算下一次發生的目標時間
      function getNextRecurringDate(clock) {
        const now = new Date();
        
        if (clock.recurringFreq === 'daily') {
          let targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), clock.targetHour, clock.targetMinute, 0, 0);
          if (targetDate <= now) {
            targetDate.setDate(targetDate.getDate() + 1);
          }
          return targetDate;
        }

        let nextDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), clock.targetHour, clock.targetMinute, 0, 0);

        if (clock.recurringFreq === 'yearly') {
          let [m, d] = clock.recurringValue.split('-').map(Number);
          m -= 1; // JS months are 0-indexed
          
          let targetYear = now.getFullYear();
          let targetDate = new Date(targetYear, m, d, clock.targetHour, clock.targetMinute, 0, 0);
          
          if (targetDate.getMonth() !== m) {
            targetDate = new Date(targetYear, m + 1, 0, clock.targetHour, clock.targetMinute, 0, 0);
          }
          
          if (targetDate <= now) {
            targetYear++;
            targetDate = new Date(targetYear, m, d, clock.targetHour, clock.targetMinute, 0, 0);
            if (targetDate.getMonth() !== m) {
              targetDate = new Date(targetYear, m + 1, 0, clock.targetHour, clock.targetMinute, 0, 0);
            }
          }
          return targetDate;

        } else if (clock.recurringFreq === 'monthly') {
          let d = parseInt(clock.recurringValue, 10);
          let targetYear = now.getFullYear();
          let targetMonth = now.getMonth();
          
          let targetDate = new Date(targetYear, targetMonth, d, clock.targetHour, clock.targetMinute, 0, 0);
          if (targetDate.getMonth() !== targetMonth) {
            targetDate = new Date(targetYear, targetMonth + 1, 0, clock.targetHour, clock.targetMinute, 0, 0);
          }
          
          if (targetDate <= now) {
            targetMonth++;
            targetDate = new Date(targetYear, targetMonth, d, clock.targetHour, clock.targetMinute, 0, 0);
            if (targetDate.getMonth() !== targetMonth % 12) {
              targetDate = new Date(targetYear, targetMonth + 1, 0, clock.targetHour, clock.targetMinute, 0, 0);
            }
          }
          return targetDate;

        } else if (clock.recurringFreq === 'weekly') {
          let targetDay = parseInt(clock.recurringValue, 10); // 0-6
          let currentDay = now.getDay();
          let daysToAdd = targetDay - currentDay;
          
          if (daysToAdd < 0 || (daysToAdd === 0 && now >= nextDate)) {
            daysToAdd += 7;
          }
          
          nextDate.setDate(nextDate.getDate() + daysToAdd);
          return nextDate;
        }
        return nextDate;
      }

      // ================== 表單動態顯示 ==================
      function updateFormFields() {
        const selectedType = typeInput.value;
        
        // 先全部隱藏
        nameRow.classList.add('hidden');
        dateRow.classList.add('hidden');
        timeRow.classList.add('hidden');
        birthRow.classList.add('hidden');
        recurringFreqRow.classList.add('hidden');
        recurringValueRow.classList.add('hidden');
        recurringTimeRow.classList.add('hidden');

        if (selectedType === 'retirement') {
          birthRow.classList.remove('hidden');
          dateRow.classList.remove('hidden');
          timeRow.classList.remove('hidden');
        } else if (selectedType === 'custom') {
          nameRow.classList.remove('hidden');
          dateRow.classList.remove('hidden');
          timeRow.classList.remove('hidden');
        } else if (selectedType === 'recurring') {
          nameRow.classList.remove('hidden');
          recurringFreqRow.classList.remove('hidden');
          recurringTimeRow.classList.remove('hidden');
          updateRecurringValues();
        }
      }

      typeInput.addEventListener('change', updateFormFields);

      // ================== 核心邏輯 ==================
      
      function renderTabs() {
        tabsContainer.innerHTML = '';
        
        const canDelete = clocks.length > 1;

        clocks.forEach(clock => {
          const tabDiv = document.createElement('div');
          tabDiv.className = activeId === clock.id ? 'tab-btn active' : 'tab-btn';
          tabDiv.dataset.id = clock.id;
          
          const text = document.createElement('span');
          text.textContent = clock.name;
          text.style.pointerEvents = 'none'; 
          
          tabDiv.appendChild(text);
          
          if (canDelete) {
            const close = document.createElement('span');
            close.className = 'tab-close';
            close.innerHTML = '✕';
            close.title = '刪除此時鐘';
            
            close.addEventListener('click', (e) => {
              e.preventDefault();
              e.stopPropagation();
              deleteClock(clock.id);
            });
            
            tabDiv.appendChild(close);
          }
          
          tabDiv.addEventListener('click', () => {
            switchClock(clock.id);
          });
          
          tabsContainer.appendChild(tabDiv);
        });
      }

      function switchClock(id) {
        activeId = id;
        renderTabs();
        updateDisplay();
      }

      function deleteClock(id) {
        clocks = clocks.filter(c => c.id !== id);
        
        if (activeId === id) {
          if (clocks.length > 0) {
            activeId = clocks[0].id;
          }
        }
        
        renderTabs();
        updateDisplay();
      }

      function updateDisplay() {
        const activeClock = clocks.find(c => c.id === activeId);
        if (!activeClock) return;

        const now = new Date();
        let targetDate = activeClock.targetDate;

        // 處理重複日期的計算
        if (activeClock.type === 'recurring') {
          targetDate = getNextRecurringDate(activeClock);
        }

        let diff = targetDate - now;

        // 更新日期顯示
        if (activeClock.type === 'recurring') {
          let freqStr = '';
          if (activeClock.recurringFreq === 'daily') {
            freqStr = '每日';
          } else if (activeClock.recurringFreq === 'yearly') {
            let [m, d] = activeClock.recurringValue.split('-');
            freqStr = `每年 ${m}月${d}日`;
          } else if (activeClock.recurringFreq === 'monthly') {
            freqStr = `每月 ${activeClock.recurringValue} 日`;
          } else if (activeClock.recurringFreq === 'weekly') {
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            freqStr = `每週${days[activeClock.recurringValue]}`;
          }
          targetDateDisplayEl.textContent = `${freqStr} · ${activeClock.name}`;
        } else {
          targetDateDisplayEl.textContent = `${toDisplayDateString(targetDate)} · ${activeClock.name}`;
        }

        // 更新標題
        countdownTitleEl.textContent = `⏳ 距離${activeClock.name}倒數...`;
        
        // 更新修改按鈕文字
        editBtn.innerHTML = `⚙️ 修改${activeClock.name}`;

        // 年齡區塊
        if (activeClock.type === 'retirement') {
          ageSection.classList.remove('hidden');
          currentAgeEl.textContent = calculateAge(activeClock.birthDate, now);
          retireAgeEl.textContent = calculateAge(activeClock.birthDate, targetDate);
          birthNoteEl.textContent = `(${toNoteDateString(activeClock.birthDate)} 出生)`;
          retireNoteEl.textContent = `(${toNoteDateString(targetDate)})`;
        } else {
          ageSection.classList.add('hidden');
        }

        // 倒數時間顯示
        if (diff <= 0) {
          daysEl.textContent = '0';
          hoursEl.textContent = '0';
          minutesEl.textContent = '0';
          secondsEl.textContent = '0';
          messageEl.innerHTML = `🎉 您已經到達${activeClock.name}目標！`;
          return;
        }

        const msPerSecond = 1000;
        const msPerMinute = 60 * msPerSecond;
        const msPerHour = 60 * msPerMinute;
        const msPerDay = 24 * msPerHour;

        const days = Math.floor(diff / msPerDay);
        diff -= days * msPerDay;

        const hours = Math.floor(diff / msPerHour);
        diff -= hours * msPerHour;

        const minutes = Math.floor(diff / msPerMinute);
        diff -= minutes * msPerMinute;

        const seconds = Math.floor(diff / msPerSecond);

        daysEl.textContent = days;
        hoursEl.textContent = pad2(hours);
        minutesEl.textContent = pad2(minutes);
        secondsEl.textContent = pad2(seconds);

        const totalDays = Math.ceil((targetDate - now) / msPerDay);
        messageEl.innerHTML = `距離${activeClock.name}還有 <strong>${totalDays.toLocaleString()}</strong> 天`;
      }

      let timer = null;
      function startTimer() {
        if (timer) clearInterval(timer);
        updateDisplay();
        timer = setInterval(updateDisplay, 1000);
      }

      // ================== Modal 控制 ==================
      function openModal(mode) {
        modalMode = mode;
        settingsHint.textContent = '';
        settingsHint.className = 'settings-hint';
        
        const activeClock = clocks.find(c => c.id === activeId);

        if (mode === 'create') {
          modalTitle.textContent = '➕ 新增時鐘';
          
          typeInput.value = 'custom';
          updateFormFields();
          
          nameInput.value = '';
          targetInput.value = toInputDateString(new Date());
          hourInput.value = '0';
          minuteInput.value = '0';
          birthInput.value = '2000-01-01';
          
          recurringFreqInput.value = 'daily';
          updateRecurringValues();
          recurringHourInput.value = '0';
          recurringMinuteInput.value = '0';
          
        } else {
          modalTitle.textContent = `⚙️ 修改 ${activeClock.name}`;
          
          typeInput.value = activeClock.type;
          updateFormFields();
          
          if (activeClock.type === 'retirement' || activeClock.type === 'custom') {
            targetInput.value = toInputDateString(activeClock.targetDate);
            hourInput.value = activeClock.targetDate.getHours();
            minuteInput.value = activeClock.targetDate.getMinutes();
            if (activeClock.type === 'retirement') {
              birthInput.value = toInputDateString(activeClock.birthDate);
            } else {
              nameInput.value = activeClock.name;
            }
          } else if (activeClock.type === 'recurring') {
            nameInput.value = activeClock.name;
            recurringFreqInput.value = activeClock.recurringFreq;
            updateRecurringValues();
            if (activeClock.recurringFreq !== 'daily') {
              recurringValueInput.value = activeClock.recurringValue;
            }
            recurringHourInput.value = activeClock.targetHour;
            recurringMinuteInput.value = activeClock.targetMinute;
          }
        }
        
        modalOverlay.classList.add('open');
      }

      function closeModal() {
        modalOverlay.classList.remove('open');
      }

      // ================== 事件綁定 ==================
      
      editBtn.addEventListener('click', () => openModal('edit'));
      createBtn.addEventListener('click', () => openModal('create'));
      cancelBtn.addEventListener('click', closeModal);

      modalOverlay.addEventListener('click', function(e) {
        if (e.target === modalOverlay) closeModal();
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && modalOverlay.classList.contains('open')) {
          closeModal();
        }
      });

      applyBtn.addEventListener('click', function() {
        const selectedType = typeInput.value;
        let newTargetDate = null;
        let newName = '';
        let newBirthDate = null;
        let recurringData = null;

        if (selectedType === 'recurring') {
          newName = nameInput.value.trim();
          if (!newName) {
            settingsHint.textContent = '請輸入時鐘名稱。';
            settingsHint.classList.add('error');
            return;
          }
          
          const freq = recurringFreqInput.value;
          const val = freq === 'daily' ? '' : recurringValueInput.value;
          const tHour = parseInt(recurringHourInput.value, 10);
          const tMinute = parseInt(recurringMinuteInput.value, 10);
          
          recurringData = {
            recurringFreq: freq,
            recurringValue: val,
            targetHour: tHour,
            targetMinute: tMinute
          };
          
          newTargetDate = new Date();

        } else {
          const targetDateVal = targetInput.value;
          const targetHour = parseInt(hourInput.value, 10);
          const targetMinute = parseInt(minuteInput.value, 10);
          
          if (!targetDateVal) {
            settingsHint.textContent = '請填寫目標日期。';
            settingsHint.classList.add('error');
            return;
          }

          newTargetDate = new Date(targetDateVal + 'T00:00:00');
          if (isNaN(newTargetDate.getTime())) {
            settingsHint.textContent = '日期格式不正確。';
            settingsHint.classList.add('error');
            return;
          }
          newTargetDate.setHours(targetHour, targetMinute, 0, 0);

          if (selectedType === 'retirement') {
            newName = '退休倒數';
            const birthVal = birthInput.value;
            if (!birthVal) {
              settingsHint.textContent = '請填寫出生日期。';
              settingsHint.classList.add('error');
              return;
            }
            newBirthDate = new Date(birthVal + 'T00:00:00');
            if (newBirthDate >= newTargetDate) {
              settingsHint.textContent = '出生日期必須早於目標時間。';
              settingsHint.classList.add('error');
              return;
            }
          } else {
            newName = nameInput.value.trim();
            if (!newName) {
              settingsHint.textContent = '請輸入時鐘名稱。';
              settingsHint.classList.add('error');
              return;
            }
          }
        }

        if (modalMode === 'create') {
          const newClock = {
            id: 'custom_' + Date.now(),
            name: newName,
            targetDate: newTargetDate,
            birthDate: newBirthDate,
            type: selectedType,
            isDefault: false,
            ...(recurringData || {})
          };
          
          clocks.push(newClock);
          settingsHint.textContent = '已新增時鐘！';
          settingsHint.classList.add('success');
          
          setTimeout(() => {
            closeModal();
            switchClock(newClock.id);
          }, 500);

        } else {
          const activeClock = clocks.find(c => c.id === activeId);
          
          activeClock.type = selectedType;
          activeClock.name = newName;
          activeClock.targetDate = newTargetDate;
          
          if (selectedType === 'retirement') {
            activeClock.birthDate = newBirthDate;
          }
          
          if (selectedType === 'recurring') {
            Object.assign(activeClock, recurringData);
          } else {
            // 清除重複屬性
            delete activeClock.recurringFreq;
            delete activeClock.recurringValue;
            delete activeClock.targetHour;
            delete activeClock.targetMinute;
          }
          
          settingsHint.textContent = '已更新時鐘！';
          settingsHint.classList.add('success');
          
          setTimeout(() => {
            closeModal();
            updateDisplay();
            renderTabs();
          }, 500);
        }
      });

      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(event) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });

      document.addEventListener('gesturestart', function(event) {
        event.preventDefault();
      });

      // ================== 初始化 ==================
      renderTabs();
      startTimer();

    })();
  </script>
</body>
</html>
