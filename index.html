<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1a2e">
  <title>🏃💨 逃離社畜生活</title>
  <!-- 載入 SortableJS 用於分頁拖拽排序 -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: #0b1a2e; height: 100%; }
    body {
      background: linear-gradient(145deg, #0b1a2e 0%, #1b2f48 100%);
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
      padding: max(2rem, env(safe-area-inset-top) + 1rem)
               max(0.8rem, env(safe-area-inset-right))
               max(0.8rem, env(safe-area-inset-bottom))
               max(0.8rem, env(safe-area-inset-left));
      margin: 0; overflow-x: hidden; position: relative;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    .version-text {
      position: absolute; top: max(0.6rem, env(safe-area-inset-top) + 0.4rem);
      left: max(0.6rem, env(safe-area-inset-left) + 0.4rem); z-index: 9999;
      font-size: 0.65rem; letter-spacing: 1px; color: #ffffff; font-weight: 600;
      font-variant-numeric: tabular-nums; pointer-events: none; user-select: none;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
    }
    .top-right-actions {
      position: absolute; top: max(0.6rem, env(safe-area-inset-top) + 0.4rem);
      right: max(0.6rem, env(safe-area-inset-right) + 0.4rem); z-index: 9999;
      display: flex; align-items: center; gap: 6px;
    }
    .threads-link, .reset-btn {
      font-size: 0.75rem; color: #aac8e4; text-decoration: none; font-weight: 500;
      letter-spacing: 0.5px; transition: all 0.2s ease;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
      display: flex; align-items: center; gap: 4px;
      background: rgba(13, 26, 39, 0.7); border: 1px solid rgba(255, 210, 120, 0.3);
      border-radius: 50px; padding: 0.3rem 0.6rem; cursor: pointer;
      font-family: inherit; white-space: nowrap;
    }
    .threads-link:hover, .reset-btn:hover {
      color: #ffd966; background: rgba(255, 190, 77, 0.15); border-color: #ffbe4d;
      text-shadow: 0 0 8px rgba(255, 190, 77, 0.5);
    }
    .reset-btn { color: #ffb3b3; border-color: rgba(255, 150, 150, 0.35); }
    .reset-btn:hover { color: #ff8080; background: rgba(255, 92, 92, 0.15); border-color: #ff8080; text-shadow: 0 0 8px rgba(255, 128, 128, 0.5); }
    .app-title {
      font-size: 1.5rem; font-weight: 700; color: #ffd966;
      text-shadow: 0 4px 12px rgba(255, 200, 80, 0.4);
      margin-bottom: 1.2rem; letter-spacing: 2px; line-height: 1.2; text-align: center;
    }
    .card {
      background: rgba(18, 30, 48, 0.85); backdrop-filter: blur(12px);
      border-radius: 1.6rem; padding: 1.4rem 1.1rem;
      box-shadow: 0 30px 45px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 210, 120, 0.2) inset;
      max-width: 820px; width: 100%; text-align: center;
      border: 1px solid rgba(255, 210, 120, 0.25); transition: all 0.2s ease;
      margin-top: 0; touch-action: manipulation;
      max-height: calc(100dvh - 2rem); display: flex; flex-direction: column;
    }
    .tabs-container {
      display: flex; flex-wrap: wrap; gap: 0.5rem;
      padding-bottom: 0.8rem; margin-bottom: 0.5rem;
      border-bottom: 1px solid rgba(255, 210, 120, 0.2);
    }
    .tab-btn {
      background: rgba(13, 26, 39, 0.7); border: 1px solid rgba(255, 210, 120, 0.3);
      border-radius: 0.6rem; color: #92adc9; padding: 0.4rem 0.8rem;
      font-size: 0.8rem; font-weight: 500; white-space: nowrap;
      display: flex; align-items: center; gap: 6px; transition: all 0.2s ease;
      user-select: none; max-width: 150px;
    }
    .tab-drag-handle { cursor: grab; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .tab-drag-handle:active { cursor: grabbing; }
    .tab-btn.active { background: rgba(255, 190, 77, 0.15); border-color: #ffbe4d; color: #ffd966; font-weight: 700; }
    .tab-close {
      color: #ff9b9b; font-weight: 700; padding: 0 4px; cursor: pointer;
      font-size: 1rem; line-height: 1; border-radius: 50%;
      transition: background 0.1s; display: inline-block; flex-shrink: 0; pointer-events: auto;
    }
    .tab-close:hover { color: #ff5c5c; background: rgba(255, 92, 92, 0.15); }
    .target-date-row {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; margin-bottom: 0.8rem; flex-wrap: wrap;
    }
    .target-date {
      color: #aac8e4; font-size: 0.78rem; letter-spacing: 1.5px; font-weight: 300;
      padding-bottom: 0.2rem;
      display: inline-block; max-width: 100%; line-height: 1.4; word-break: break-word;
    }
    .countdown-title {
      font-size: 1.1rem; font-weight: 500; color: #f5e7c8;
      text-shadow: 0 4px 12px rgba(255, 200, 80, 0.3);
      margin-bottom: 0.8rem; letter-spacing: 1px;
      display: flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.4;
    }
    .grid-container { width: 100%; display: flex; flex-direction: column; gap: 0.85rem; margin-bottom: 0.5rem; }
    .row { width: 100%; display: flex; justify-content: center; gap: 0.85rem; }
    .time-block {
      background: #0d1a27; border-radius: 1rem; padding: 0.7rem 0.25rem;
      flex: 1 1 0; min-width: 0;
      box-shadow: 0 12px 18px -8px black, 0 0 0 1px rgba(255, 210, 120, 0.2);
      border-bottom: 3px solid #ffbe4d;
    }
    .time-block.days-block { flex: 1 1 100%; }
    .time-value {
      font-size: 1.7rem; font-weight: 800; color: #ffe9b6; line-height: 1.1;
      font-variant-numeric: tabular-nums; text-shadow: 0 0 12px #f0b34b;
      letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .time-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; color: #92adc9; margin-top: 0.3rem; font-weight: 400; }
    .age-section {
      width: 100%; display: flex; justify-content: center; gap: 1rem;
      background: rgba(10, 20, 30, 0.7); border-radius: 1.5rem; padding: 7px 0.8rem;
      border: 1px solid rgba(255, 200, 100, 0.3);
    }
    .age-item { display: flex; flex-direction: column; align-items: center; flex: 1 1 0; min-width: 0; }
    .age-label { font-size: 0.7rem; color: #b8cfec; letter-spacing: 0.8px; margin-bottom: 0.3rem; }
    .age-value {
      font-size: 1.2rem; padding: 2px 0.8rem; font-weight: 700; color: #ffd966;
      background: #162433; border-radius: 50px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.7), 0 0 0 1px #b88c3a; line-height: 1.2;
    }
    .age-note {
      font-size: 0.65rem; color: #97b3d0; margin-top: 0.3rem; font-style: italic;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
    }
    .settings {
      margin-top: 0.6rem; padding-top: 0.5rem;
      border-top: 1px dashed rgba(255, 220, 140, 0.3);
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    .settings-toggle {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; padding: 0.55rem 0.6rem;
      background: rgba(13, 26, 39, 0.7); border: 1px solid rgba(255, 210, 120, 0.3);
      border-radius: 0.7rem; color: #f5e7c8; font-size: 0.82rem; font-weight: 500;
      letter-spacing: 0.8px; cursor: pointer; touch-action: manipulation;
      transition: background 0.15s ease;
    }
    .settings-toggle:active { background: rgba(255, 190, 77, 0.15); }
    .btn-create { color: #7ee0a1; border-color: rgba(126, 224, 161, 0.4); }
    .btn-create:active { background: rgba(126, 224, 161, 0.15); }
    .footnote { margin-top: 0.6rem; font-size: 0.6rem; color: #6e8aa8; letter-spacing: 0.3px; }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px); z-index: 10000; display: none;
      align-items: center; justify-content: center; padding: 1.2rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #121e30; border: 1px solid rgba(255, 210, 120, 0.35);
      border-radius: 1.4rem; padding: 1.4rem 1.2rem; width: 100%;
      max-width: 360px; max-height: 90dvh; overflow-y: auto;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 215, 120, 0.15) inset;
      touch-action: manipulation;
    }
    .modal-title {
      font-size: 1rem; color: #f5e7c8; font-weight: 600; letter-spacing: 1px;
      text-align: center; margin-bottom: 1rem;
    }
    .modal-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.6rem; margin-bottom: 0.7rem; flex-wrap: wrap;
    }
    .modal-row label { font-size: 0.8rem; color: #b8cfec; letter-spacing: 0.3px; flex: 0 0 auto; }
    .modal-row input[type="text"],
    .modal-row input[type="date"],
    .modal-row select {
      flex: 1 1 auto; min-width: 130px; max-width: 100%;
      background: #0d1a27; border: 1px solid rgba(255, 210, 120, 0.35);
      border-radius: 0.6rem; padding: 0.45rem 0.6rem;
      color: #ffe9b6; font-size: 0.85rem; font-family: inherit;
      outline: none; touch-action: manipulation;
    }
    .modal-row input:focus, .modal-row select:focus {
      border-color: #ffbe4d; box-shadow: 0 0 0 2px rgba(255, 190, 77, 0.25);
    }
    .time-selects { display: flex; gap: 0.4rem; flex: 1 1 auto; }
    .time-selects select { flex: 1; min-width: 60px; padding: 0.45rem 0.4rem; }
    .modal-actions { display: flex; gap: 0.6rem; margin-top: 1rem; }
    .modal-actions button {
      flex: 1 1 0; padding: 0.6rem 0.8rem; font-size: 0.85rem; font-weight: 700;
      letter-spacing: 0.5px; border: none; border-radius: 0.7rem; cursor: pointer;
      touch-action: manipulation; transition: transform 0.1s ease, box-shadow 0.2s ease;
    }
    .modal-actions .btn-cancel {
      background: rgba(255, 255, 255, 0.08); color: #c9dbf0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .modal-actions .btn-cancel:active { background: rgba(255, 255, 255, 0.15); }
    .modal-actions .btn-apply {
      background: linear-gradient(145deg, #ffbe4d, #e6a32e); color: #0b1a2e;
      box-shadow: 0 8px 18px -8px rgba(255, 190, 77, 0.6);
    }
    .modal-actions .btn-apply:active { transform: translateY(1px); box-shadow: 0 4px 10px -6px rgba(255, 190, 77, 0.5); }
    .settings-hint { margin-top: 0.6rem; font-size: 0.72rem; color: #97b3d0; text-align: center; min-height: 1em; }
    .settings-hint.error { color: #ff9b9b; }
    .settings-hint.success { color: #7ee0a1; }
    .hidden { display: none !important; }
    .weekday-checkboxes { display: flex; flex-wrap: wrap; gap: 0.4rem; flex: 1 1 auto; justify-content: flex-end; }
    .weekday-checkboxes label { display: flex; align-items: center; gap: 2px; font-size: 0.75rem; color: #ffe9b6; cursor: pointer; }
    .weekday-checkboxes input[type="checkbox"] { accent-color: #ffbe4d; }
    .notification-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px); z-index: 20000; display: none;
      align-items: center; justify-content: center; padding: 1.5rem;
    }
    .notification-overlay.open { display: flex; }
    .notification-box {
      background: #121e30; border: 2px solid #ffd966; border-radius: 1.6rem;
      padding: 2rem 1.5rem; width: 100%; max-width: 320px; text-align: center;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 200, 80, 0.3);
      transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .notification-overlay.open .notification-box { transform: scale(1); }
    .notification-text { font-size: 1.2rem; color: #ffd966; font-weight: 700; line-height: 1.5; margin-bottom: 1.5rem; word-break: break-word; }
    .notification-btn {
      background: linear-gradient(145deg, #ffbe4d, #e6a32e); color: #0b1a2e;
      border: none; padding: 0.8rem 2rem; font-size: 1rem; font-weight: 700;
      border-radius: 50px; cursor: pointer;
      box-shadow: 0 8px 18px -8px rgba(255, 190, 77, 0.6);
      transition: transform 0.1s ease;
    }
    .notification-btn:active { transform: scale(0.95); }
    .confirm-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px); z-index: 21000; display: none;
      align-items: center; justify-content: center; padding: 1.5rem;
    }
    .confirm-overlay.open { display: flex; }
    .confirm-box {
      background: #121e30; border: 2px solid #ff8080; border-radius: 1.4rem;
      padding: 1.8rem 1.4rem; width: 100%; max-width: 320px; text-align: center;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 92, 92, 0.25);
    }
    .confirm-emoji { font-size: 2.5rem; margin-bottom: 0.8rem; }
    .confirm-title { font-size: 1.05rem; color: #ffb3b3; font-weight: 700; margin-bottom: 0.6rem; }
    .confirm-desc { font-size: 0.82rem; color: #c9dbf0; line-height: 1.5; margin-bottom: 1.4rem; }
    .confirm-actions { display: flex; gap: 0.6rem; }
    .confirm-actions button {
      flex: 1 1 0; padding: 0.65rem 0.8rem; font-size: 0.88rem; font-weight: 700;
      border: none; border-radius: 0.7rem; cursor: pointer; font-family: inherit;
      transition: transform 0.1s ease;
    }
    .confirm-actions .btn-cancel {
      background: rgba(255, 255, 255, 0.08); color: #c9dbf0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .confirm-actions .btn-danger {
      background: linear-gradient(145deg, #ff7b7b, #e64d4d); color: #fff;
      box-shadow: 0 8px 18px -8px rgba(255, 92, 92, 0.6);
    }
    .confirm-actions button:active { transform: scale(0.97); }
    @media (min-width: 600px) {
      body { padding: 3rem 1.5rem 1.5rem; touch-action: auto; }
      .app-title { font-size: 1.8rem; margin-bottom: 1.5rem; letter-spacing: 3px; }
      .card { touch-action: auto; border-radius: 2.5rem; padding: 2rem 2rem; max-height: none; }
      .tabs-container { gap: 0.8rem; padding-bottom: 1rem; }
      .tab-btn { font-size: 0.95rem; padding: 0.5rem 1rem; }
      .tab-close { font-size: 1.1rem; }
      .target-date { font-size: 0.88rem; letter-spacing: 2px; margin-bottom: 1.2rem; padding-bottom: 0.2rem; }
      .countdown-title { font-size: 1.5rem; margin-bottom: 1.2rem; letter-spacing: 1.5px; }
      .grid-container { gap: 1.1rem; margin-bottom: 0.8rem; }
      .row { gap: 1.1rem; }
      .time-block { border-radius: 1.4rem; padding: 0.9rem 0.35rem; }
      .time-value { font-size: 2.2rem; letter-spacing: 0.8px; }
      .time-label { font-size: 0.68rem; letter-spacing: 1.5px; margin-top: 0.35rem; }
      .age-section { gap: 1.2rem; border-radius: 2rem; padding: 1rem 1.2rem; }
      .age-label { font-size: 0.75rem; }
      .age-value { font-size: 1.5rem; padding: 0.2rem 1rem; }
      .age-note { font-size: 0.7rem; }
      .settings { margin-top: 0.8rem; padding-top: 0.7rem; }
      .settings-toggle { font-size: 0.9rem; padding: 0.65rem 0.8rem; }
      .footnote { margin-top: 0.8rem; font-size: 0.65rem; }
      .version-text { font-size: 0.75rem; letter-spacing: 1.2px; top: max(1rem, env(safe-area-inset-top) + 0.5rem); left: max(1rem, env(safe-area-inset-left) + 0.5rem); }
      .top-right-actions { top: max(1rem, env(safe-area-inset-top) + 0.5rem); right: max(1rem, env(safe-area-inset-right) + 0.5rem); gap: 8px; }
      .threads-link, .reset-btn { font-size: 0.85rem; padding: 0.4rem 0.8rem; }
      .modal { max-width: 400px; padding: 1.8rem 1.6rem; }
      .modal-title { font-size: 1.15rem; }
      .modal-row label { font-size: 0.9rem; }
      .modal-row input[type="text"], .modal-row input[type="date"], .modal-row select { font-size: 0.95rem; padding: 0.55rem 0.7rem; }
      .modal-actions button { font-size: 0.95rem; padding: 0.7rem 1rem; }
      .weekday-checkboxes label { font-size: 0.85rem; }
    }
    @media (max-width: 340px) {
      .app-title { font-size: 1.2rem; margin-bottom: 0.8rem; }
      .card { padding: 1rem 0.7rem; }
      .countdown-title { font-size: 1rem; margin-bottom: 0.6rem; }
      .time-value { font-size: 1.4rem; }
      .time-label { font-size: 0.6rem; }
      .age-value { font-size: 1.2rem; }
      .age-label, .age-note { font-size: 0.58rem; }
      .version-text { font-size: 0.55rem; top: max(0.4rem, env(safe-area-inset-top) + 0.2rem); left: max(0.4rem, env(safe-area-inset-left) + 0.2rem); }
      .top-right-actions { top: max(0.4rem, env(safe-area-inset-top) + 0.2rem); right: max(0.4rem, env(safe-area-inset-right) + 0.2rem); gap: 4px; }
      .threads-link, .reset-btn { font-size: 0.6rem; padding: 0.2rem 0.4rem; }
      .modal-row { flex-direction: column; align-items: stretch; }
      .modal-row label { margin-bottom: 0.15rem; }
      .weekday-checkboxes { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="version-text" id="versionText">v6.4.0 Mobile</div>

  <div class="top-right-actions">
    <button class="reset-btn" id="resetBtn" type="button">🔄 重設</button>
    <a href="https://www.threads.com/@salarythief.earlyretire" target="_blank" rel="noopener noreferrer" class="threads-link">
      🥷 薪水小偷/提早退休
    </a>
  </div>

  <div class="app-title">🏃💨 逃離社畜生活</div>

  <div class="card">
    <div class="tabs-container" id="tabsContainer"></div>

    <div class="target-date-row">
      <div class="target-date" id="targetDateDisplay">2060年1月1日 · 退休日</div>
    </div>

    <div class="countdown-title" id="countdownTitle">⏳ 距離退休仲有</div>

    <div class="grid-container">
      <div class="row">
        <div class="time-block days-block">
          <div class="time-value" id="days">--</div>
          <div class="time-label">日</div>
        </div>
      </div>
      <div class="row">
        <div class="time-block"><div class="time-value" id="hours">--</div><div class="time-label">小時</div></div>
        <div class="time-block"><div class="time-value" id="minutes">--</div><div class="time-label">分鐘</div></div>
        <div class="time-block"><div class="time-value" id="seconds">--</div><div class="time-label">秒</div></div>
      </div>
      <div class="age-section" id="ageSection">
        <div class="age-item">
          <div class="age-label">現在年齡</div>
          <div class="age-value" id="currentAge">--</div>
          <div class="age-note" id="birthNote">(2000/01/01 出生)</div>
        </div>
        <div class="age-item">
          <div class="age-label">退休時年齡</div>
          <div class="age-value" id="retireAge">--</div>
          <div class="age-note" id="retireNote">(2060/01/01)</div>
        </div>
      </div>
    </div>

    <div class="settings">
      <button class="settings-toggle" id="editBtn" type="button">⚙️ 修改時鐘</button>
      <button class="settings-toggle btn-create" id="createBtn" type="button">➕ 新增時鐘</button>
    </div>

    <div class="footnote">⏱️ 倒數自動刷新</div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-title" id="modalTitle">⚙️ 設定時鐘</div>
      <div class="modal-row" id="typeRow">
        <label for="typeInput">時鐘類型</label>
        <select id="typeInput">
          <option value="custom">自訂日期</option>
          <option value="recurring">重複日期</option>
          <option value="holiday">公眾假期</option>
          <option value="retirement">退休倒數</option>
        </select>
      </div>
      <div class="modal-row hidden" id="templateRow">
        <label for="templateInput">快速範本</label>
        <select id="templateInput">
          <option value="none">自訂</option>
          <option value="offwork">收工</option>
          <option value="lunch">放飯</option>
          <option value="happyfriday">Happy Friday</option>
          <option value="salary">出糧</option>
        </select>
      </div>
      <div class="modal-row" id="nameRow">
        <label for="nameInput">時鐘名稱</label>
        <input type="text" id="nameInput" placeholder="例如：出糧" maxlength="15">
      </div>
      <div class="modal-row" id="dateRow">
        <label for="targetInput">目標日期</label>
        <input type="date" id="targetInput">
      </div>
      <div class="modal-row" id="timeRow">
        <label>目標時間</label>
        <div class="time-selects">

      function ensureClockUpToDate(c) {
        const now = new Date();

        if (c.type === 'recurring') {
          if (!c.targetDate || c.targetDate <= now) {
            c.targetDate = getNextRecurringDate(c);
            c.isDue = false;
          }
        } else if (c.type === 'holiday') {
          if (!c.targetDate || c.targetDate <= now) {
            const nextHoliday = getNextHoliday(c);
            if (nextHoliday) {
              c.targetDate = nextHoliday.date;
              c.isDue = false;
            }
          }
        }
      }

      function loadClocks() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) {
            const parsed = JSON.parse(stored);
            if (Array.isArray(parsed) && parsed.length > 0) {
              clocks = parsed.map(c => {
                const newC = { ...c };
                if (newC.targetDate) newC.targetDate = new Date(newC.targetDate);
                if (newC.birthDate) newC.birthDate = new Date(newC.birthDate);
                if (newC.customEmoji) {
                  newC.customMessage = (newC.customEmoji + ' ' + (newC.customMessage || '')).trim();
                  delete newC.customEmoji;
                }
                newC.isDue = false;
                ensureClockUpToDate(newC);
                return newC;
              });
              if (!clocks.find(c => c.id === activeId)) activeId = clocks[0].id;
              return;
            }
          }
        } catch (e) { console.warn('LocalStorage read failed.', e); }
        clocks = [
          { ...defaultRetirement }, { ...defaultHoliday }, { ...defaultSalary },
          { ...defaultFriday }, { ...defaultOffwork }, { ...defaultLunch }
        ];
        clocks.forEach(c => ensureClockUpToDate(c));
      }

      function saveClocks() {
        try {
          const toStore = clocks.map(c => {
            const newC = { ...c };
            if (newC.targetDate) newC.targetDate = newC.targetDate.toISOString();
            if (newC.birthDate) newC.birthDate = newC.birthDate.toISOString();
            delete newC.isDue;
            delete newC.customEmoji;
            return newC;
          });
          localStorage.setItem(STORAGE_KEY, JSON.stringify(toStore));
        } catch (e) { console.warn('LocalStorage save failed.', e); }
      }

      function pad2(n) { return String(n).padStart(2, '0'); }
      function toInputDateString(date) { return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`; }
      function toDisplayDateString(date) { return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`; }
      function toNoteDateString(date) { return `${date.getFullYear()}/${pad2(date.getMonth() + 1)}/${pad2(date.getDate())}`; }

      function calculateAge(birthDate, referenceDate) {
        const birthYear = birthDate.getFullYear();
        const birthMonth = birthDate.getMonth();
        const birthDay = birthDate.getDate();
        const refYear = referenceDate.getFullYear();
        const refMonth = referenceDate.getMonth();
        const refDay = referenceDate.getDate();
        let age = refYear - birthYear;
        if (refMonth < birthMonth || (refMonth === birthMonth && refDay < birthDay)) age--;
        return age;
      }

      function getNextRecurringDate(clock) {
        const now = new Date();
        if (clock.recurringFreq === 'daily') {
          let targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), clock.targetHour, clock.targetMinute, 0, 0);
          if (targetDate <= now) targetDate.setDate(targetDate.getDate() + 1);
          return targetDate;
        }
        let nextDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), clock.targetHour, clock.targetMinute, 0, 0);
        if (clock.recurringFreq === 'yearly') {
          let [m, d] = clock.recurringValue.split('-').map(Number);
          m -= 1;
          let targetYear = now.getFullYear();
          let targetDate = new Date(targetYear, m, d, clock.targetHour, clock.targetMinute, 0, 0);
          if (targetDate.getMonth() !== m) targetDate = new Date(targetYear, m + 1, 0, clock.targetHour, clock.targetMinute, 0, 0);
          if (targetDate <= now) {
            targetYear++;
            targetDate = new Date(targetYear, m, d, clock.targetHour, clock.targetMinute, 0, 0);
            if (targetDate.getMonth() !== m) targetDate = new Date(targetYear, m + 1, 0, clock.targetHour, clock.targetMinute, 0, 0);
          }
          return targetDate;
        } else if (clock.recurringFreq === 'monthly') {
          let d = parseInt(clock.recurringValue, 10);
          let targetYear = now.getFullYear();
          let targetMonth = now.getMonth();
          let targetDate = new Date(targetYear, targetMonth, d, clock.targetHour, clock.targetMinute, 0, 0);
          if (targetDate.getMonth() !== targetMonth) targetDate = new Date(targetYear, targetMonth + 1, 0, clock.targetHour, clock.targetMinute, 0, 0);
          if (targetDate <= now) {
            targetMonth++;
            targetDate = new Date(targetYear, targetMonth, d, clock.targetHour, clock.targetMinute, 0, 0);
            if (targetDate.getMonth() !== targetMonth % 12) targetDate = new Date(targetYear, targetMonth + 1, 0, clock.targetHour, clock.targetMinute, 0, 0);
          }
          return targetDate;
        } else if (clock.recurringFreq === 'weekly') {
          const selectedDays = clock.recurringValue;
          const currentDay = now.getDay();
          if (selectedDays.includes(currentDay) && now < nextDate) return nextDate;
          let daysToAdd = 1;
          while (daysToAdd <= 7) {
            let checkDay = (currentDay + daysToAdd) % 7;
            if (selectedDays.includes(checkDay)) {
              let targetDate = new Date(nextDate);
              targetDate.setDate(targetDate.getDate() + daysToAdd);
              return targetDate;
            }
            daysToAdd++;
          }
        }
        return nextDate;
      }

      function getWeeklyString(selectedDays) {
        const daysMap = ['日', '一', '二', '三', '四', '五', '六'];
        const sorted = [...selectedDays].sort((a, b) => (a === 0 ? 7 : a) - (b === 0 ? 7 : b));
        let isConsecutive = true;
        for (let i = 0; i < sorted.length - 1; i++) {
          if (sorted[i+1] - sorted[i] !== 1) { isConsecutive = false; break; }
        }
        if (isConsecutive && sorted.length > 1) return `${daysMap[sorted[0]]}至${daysMap[sorted[sorted.length-1]]}`;
        return sorted.map(d => daysMap[d]).join('、');
      }

      }

      function renderTabs() {
        tabsContainer.innerHTML = '';
        const canDelete = clocks.length > 1;
        clocks.forEach(clock => {
          const tabDiv = document.createElement('div');
          tabDiv.className = activeId === clock.id ? 'tab-btn active' : 'tab-btn';
          tabDiv.dataset.id = clock.id;
          const dragHandle = document.createElement('span');
          dragHandle.className = 'tab-drag-handle';
          dragHandle.textContent = clock.name;
          tabDiv.appendChild(dragHandle);
          if (canDelete) {
            const close = document.createElement('span');
            close.className = 'tab-close';
            close.innerHTML = '✕';
            close.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              e.stopPropagation();
              deleteClock(clock.id);
            });
            tabDiv.appendChild(close);
          }
          tabDiv.addEventListener('click', () => switchClock(clock.id));
          tabsContainer.appendChild(tabDiv);
        });
        initSortable();
      }

      function switchClock(id) {
        activeId = id;
        const clock = clocks.find(c => c.id === activeId);
        if (clock) {
          ensureClockUpToDate(clock);
        }
        renderTabs();
        updateDisplay();
      }

      function deleteClock(id) {
        clocks = clocks.filter(c => c.id !== id);
        if (activeId === id) activeId = clocks.length > 0 ? clocks[0].id : null;
        saveClocks();
        renderTabs();
        updateDisplay();
      }

      function updateDisplay() {
        const activeClock = clocks.find(c => c.id === activeId);
        if (!activeClock) return;
        const now = new Date();

        if (activeClock.type === 'holiday' && !activeClock.isDue) {
          const nextHoliday = getNextHoliday(activeClock);
          if (!nextHoliday) {
            targetDateDisplayEl.textContent = '沒有未來假期資料（請更新清單）';
            countdownTitleEl.textContent = '⏳ 距離假期仲有';
            daysEl.textContent = '00'; hoursEl.textContent = '00';
            minutesEl.textContent = '00'; secondsEl.textContent = '00';
            ageSection.classList.add('hidden');
            return;
          }
          const dayOfWeek = ['日','一','二','三','四','五','六'][nextHoliday.date.getDay()];
          targetDateDisplayEl.textContent = `${nextHoliday.date.getFullYear()}年${nextHoliday.date.getMonth()+1}月${nextHoliday.date.getDate()}日(星期${dayOfWeek}) · ${nextHoliday.name}`;
          countdownTitleEl.textContent = `⏳ 距離${nextHoliday.name}仲有`;
          activeClock.targetDate = nextHoliday.date;
        }

        if (activeClock.type !== 'holiday' || activeClock.isDue) {
          if (activeClock.type === 'recurring' && !activeClock.isDue) {
            let freqStr = '';
            const timeStr = `${String(activeClock.targetHour).padStart(2,'0')}:${String(activeClock.targetMinute).padStart(2,'0')}`;
            if (activeClock.recurringFreq === 'daily') freqStr = '每日';
            else if (activeClock.recurringFreq === 'yearly') {
              const [m, d] = activeClock.recurringValue.split('-');
              freqStr = `每年 ${m}月${d}日`;
            } else if (activeClock.recurringFreq === 'monthly') {
              freqStr = `每月 ${activeClock.recurringValue} 日`;
            } else if (activeClock.recurringFreq === 'weekly') {
              freqStr = `逢星期${getWeeklyString(activeClock.recurringValue)}`;
            }
            targetDateDisplayEl.textContent = `${freqStr} ${timeStr} · ${activeClock.name}`;
          } else {
            targetDateDisplayEl.textContent = `${toDisplayDateString(activeClock.targetDate)} · ${activeClock.name}`;
          }
          countdownTitleEl.textContent = `⏳ 距離${activeClock.name}仲有`;
        }

        editBtn.innerHTML = `⚙️ 修改${activeClock.name}`;

        if (activeClock.type === 'retirement') {
          ageSection.classList.remove('hidden');
          currentAgeEl.textContent = calculateAge(activeClock.birthDate, now);
          retireAgeEl.textContent = calculateAge(activeClock.birthDate, activeClock.targetDate);
          birthNoteEl.textContent = `(${toNoteDateString(activeClock.birthDate)} 出生)`;
          retireNoteEl.textContent = `(${toNoteDateString(activeClock.targetDate)})`;
        } else {
          ageSection.classList.add('hidden');
        }

        if (activeClock.isDue) {
          daysEl.textContent = '00';
          hoursEl.textContent = '00';
          minutesEl.textContent = '00';
          secondsEl.textContent = '00';
          return;
        }

        let diff = activeClock.targetDate - now;

        if (diff <= 0) {
          activeClock.isDue = true;
          daysEl.textContent = '00';
          hoursEl.textContent = '00';
          minutesEl.textContent = '00';
          secondsEl.textContent = '00';
          showNotification(activeClock);
          return;
        }

        const msPerSecond = 1000;
        const msPerMinute = 60 * msPerSecond;
        const msPerHour = 60 * msPerMinute;
        const msPerDay = 24 * msPerHour;
        
        let d = Math.floor(diff / msPerDay); diff -= d * msPerDay;
        let h = Math.floor(diff / msPerHour); diff -= h * msPerHour;
        let m = Math.floor(diff / msPerMinute); diff -= m * msPerMinute;
        let s = Math.floor(diff / msPerSecond);

        daysEl.textContent = pad2(d);
        hoursEl.textContent = pad2(h);
        minutesEl.textContent = pad2(m);
        secondsEl.textContent = pad2(s);
      }

      let timer = null;
      function startTimer() {
        if (timer) clearInterval(timer);
        updateDisplay();
        timer = setInterval(updateDisplay, 100);
      }

      function openModal(mode) {
        modalMode = mode;
        settingsHint.textContent = '';
        settingsHint.className = 'settings-hint';
        const activeClock = clocks.find(c => c.id === activeId);
        hourInput.value = '0'; minuteInput.value = '0';
        recurringHourInput.value = '0'; recurringMinuteInput.value = '0';

        if (mode === 'create') {
          modalTitle.textContent = '➕ 新增時鐘';
          typeInput.value = 'custom';
          templateInput.value = 'none';
          updateFormFields();
          nameInput.value = '';
          targetInput.value = toInputDateString(new Date());
          birthInput.value = '2000-01-01';
          recurringFreqInput.value = 'daily';
          updateRecurringValues();
          weekdayCheckboxes.forEach(cb => cb.checked = false);
          skipWeekendCheckbox.checked = true;
          messageInput.value = '⏰ 時間到了！';
        } else {
          modalTitle.textContent = `⚙️ 修改 ${activeClock.name}`;
          typeInput.value = activeClock.type;
          templateInput.value = 'none';
          updateFormFields();
          if (activeClock.type === 'retirement' || activeClock.type === 'custom') {
            targetInput.value = toInputDateString(activeClock.targetDate);
            hourInput.value = String(activeClock.targetDate.getHours());
            minuteInput.value = String(activeClock.targetDate.getMinutes());
            if (activeClock.type === 'retirement') birthInput.value = toInputDateString(activeClock.birthDate);
            else nameInput.value = activeClock.name;
          } else if (activeClock.type === 'recurring') {
            nameInput.value = activeClock.name;
            recurringFreqInput.value = activeClock.recurringFreq;
            updateRecurringValues();
            if (activeClock.recurringFreq === 'weekly') {
              weekdayCheckboxes.forEach(cb => cb.checked = activeClock.recurringValue.includes(parseInt(cb.value, 10)));
            } else if (activeClock.recurringFreq !== 'daily') {
              recurringValueInput.value = activeClock.recurringValue;
            }
            recurringHourInput.value = String(activeClock.targetHour);
            recurringMinuteInput.value = String(activeClock.targetMinute);
          } else if (activeClock.type === 'holiday') {
            skipWeekendCheckbox.checked = activeClock.skipWeekend !== false;
          }

          messageInput.value = activeClock.customMessage || `⏰ 時間到了！${activeClock.name}`;
        }
        modalOverlay.classList.add('open');
      }

      function closeModal() { modalOverlay.classList.remove('open'); }

      editBtn.addEventListener('click', () => openModal('edit'));
      createBtn.addEventListener('click', () => openModal('create'));
      cancelBtn.addEventListener('click', closeModal);
      modalOverlay.addEventListener('click', function(e) { if (e.target === modalOverlay) closeModal(); });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && modalOverlay.classList.contains('open')) closeModal();
        if (e.key === 'Escape' && confirmOverlay.classList.contains('open')) confirmOverlay.classList.remove('open');
        if (e.key === 'Escape' && notificationOverlay.classList.contains('open')) {
          notificationCloseBtn.click();
        }
      });

      function getDefaultClocks() {
        const defaults = [
          { ...defaultRetirement }, { ...defaultHoliday }, { ...defaultSalary },
          { ...defaultFriday }, { ...defaultOffwork }, { ...defaultLunch }
        ];
        defaults.forEach(c => ensureClockUpToDate(c));
        return defaults;
      }

      resetBtn.addEventListener('click', () => confirmOverlay.classList.add('open'));
      confirmCancelBtn.addEventListener('click', () => confirmOverlay.classList.remove('open'));
      confirmOverlay.addEventListener('click', (e) => { if (e.target === confirmOverlay) confirmOverlay.classList.remove('open'); });

      confirmResetBtn.addEventListener('click', () => {
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) { console.warn(e); }
        clocks = getDefaultClocks();
        activeId = 'retirement';
        pendingNotificationClock = null;
        confirmOverlay.classList.remove('open');
        notificationOverlay.classList.remove('open');
        closeModal();
        saveClocks();
        renderTabs();
        updateDisplay();
      });

      applyBtn.addEventListener('click', function() {
        const selectedType = typeInput.value;
        let newTargetDate = null, newName = '', newBirthDate = null, recurringData = null;

        if (selectedType === 'holiday') {
          newName = '公眾假期';
          newTargetDate = new Date();
        } else if (selectedType === 'recurring') {
          newName = nameInput.value.trim();
          if (!newName) { settingsHint.textContent = '請輸入時鐘名稱。'; settingsHint.classList.add('error'); return; }
          const freq = recurringFreqInput.value;
          let val = '';
          if (freq === 'weekly') {
            const checkedBoxes = Array.from(weekdayCheckboxes).filter(cb => cb.checked);
            if (checkedBoxes.length === 0) { settingsHint.textContent = '請至少選擇一天。'; settingsHint.classList.add('error'); return; }
            val = checkedBoxes.map(cb => parseInt(cb.value, 10));
          } else if (freq !== 'daily') {
            val = recurringValueInput.value;
          }
          const tHour = parseInt(recurringHourInput.value, 10) || 0;
          const tMinute = parseInt(recurringMinuteInput.value, 10) || 0;
          recurringData = { recurringFreq: freq, recurringValue: val, targetHour: tHour, targetMinute: tMinute };
          newTargetDate = new Date();
        } else {
          const targetDateVal = targetInput.value;
          const targetHour = parseInt(hourInput.value, 10) || 0;
          const targetMinute = parseInt(minuteInput.value, 10) || 0;
          if (!targetDateVal) { settingsHint.textContent = '請填寫目標日期。'; settingsHint.classList.add('error'); return; }
          newTargetDate = new Date(targetDateVal + 'T00:00:00');
          if (isNaN(newTargetDate.getTime())) { settingsHint.textContent = '日期格式不正確。'; settingsHint.classList.add('error'); return; }
          newTargetDate.setHours(targetHour, targetMinute, 0, 0);
          if (selectedType === 'retirement') {
            newName = '退休';
            const birthVal = birthInput.value;
            if (!birthVal) { settingsHint.textContent = '請填寫出生日期。'; settingsHint.classList.add('error'); return; }
            newBirthDate = new Date(birthVal + 'T00:00:00');
            if (newBirthDate >= newTargetDate) { settingsHint.textContent = '出生日期必須早於目標時間。'; settingsHint.classList.add('error'); return; }
          } else {
            newName = nameInput.value.trim();
            if (!newName) { settingsHint.textContent = '請輸入時鐘名稱。'; settingsHint.classList.add('error'); return; }
          }
        }

        const customMessage = messageInput.value.trim() || `⏰ 時間到了！${newName}`;

        if (modalMode === 'create') {
          const newClock = {
            id: 'custom_' + Date.now(),
            name: newName,
            targetDate: newTargetDate,
            birthDate: newBirthDate,
            type: selectedType,
            isDefault: false,
            isDue: false,
            customMessage: customMessage,
            ...(recurringData || {}),
            ...(selectedType === 'holiday' ? { skipWeekend: skipWeekendCheckbox.checked } : {})
          };
          if (selectedType === 'recurring') newClock.targetDate = getNextRecurringDate(newClock);
          else if (selectedType === 'holiday') {
            const nextHoliday = getNextHoliday(newClock);
            if (nextHoliday) newClock.targetDate = nextHoliday.date;
          }
          clocks.push(newClock);
          settingsHint.textContent = '已新增時鐘！';
          settingsHint.classList.add('success');
          saveClocks();
          setTimeout(() => { closeModal(); switchClock(newClock.id); }, 500);
        } else {
          const activeClock = clocks.find(c => c.id === activeId);
          activeClock.type = selectedType;
          activeClock.name = newName;
          activeClock.targetDate = newTargetDate;
          activeClock.isDue = false;
          activeClock.customMessage = customMessage;
          delete activeClock.customEmoji;
          if (selectedType === 'retirement') activeClock.birthDate = newBirthDate;
          if (selectedType === 'recurring') {
            Object.assign(activeClock, recurringData);
            activeClock.targetDate = getNextRecurringDate(activeClock);
          } else {
            delete activeClock.recurringFreq;
            delete activeClock.recurringValue;
            delete activeClock.targetHour;
            delete activeClock.targetMinute;
          }
          if (selectedType === 'holiday') {
            activeClock.skipWeekend = skipWeekendCheckbox.checked;
            const nextHoliday = getNextHoliday(activeClock);
            if (nextHoliday) activeClock.targetDate = nextHoliday.date;
          } else {
            delete activeClock.skipWeekend;
          }
          settingsHint.textContent = '已更新時鐘！';
          settingsHint.classList.add('success');
          saveClocks();
          setTimeout(() => { closeModal(); updateDisplay(); renderTabs(); }, 500);
        }
      });

      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(event) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) event.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });
      document.addEventListener('gesturestart', function(event) { event.preventDefault(); });

      renderTabs();
      startTimer();
    })();
  </script>
</body>
</html>
