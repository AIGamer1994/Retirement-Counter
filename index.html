<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>退休倒數</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ---------- Mobile-First 基礎（手機樣式） ---------- */
    body {
      background: linear-gradient(145deg, #0b1a2e 0%, #1b2f48 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
      padding: max(3rem, env(safe-area-inset-top) + 2rem)
               max(1rem, env(safe-area-inset-right))
               max(1rem, env(safe-area-inset-bottom))
               max(1rem, env(safe-area-inset-left));
      margin: 0;
      overflow-x: hidden;
      position: relative;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---------- 左上角版本與排版文字（absolute 定位，隨滾動移動） ---------- */
    .version-text {
      position: absolute;
      top: max(0.75rem, env(safe-area-inset-top) + 0.5rem);
      left: max(0.75rem, env(safe-area-inset-left) + 0.5rem);
      z-index: 9999;
      font-size: 0.68rem;
      letter-spacing: 1px;
      color: #ffffff;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      user-select: none;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
    }

    .card {
      background: rgba(18, 30, 48, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      padding: 1.8rem 1.2rem;
      box-shadow: 0 30px 45px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 120, 0.2) inset;
      max-width: 820px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255, 210, 120, 0.25);
      transition: all 0.2s ease;
      margin-top: 0;
      touch-action: manipulation;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: 1.5px;
      color: #f5e7c8;
      text-shadow: 0 4px 12px rgba(255, 200, 80, 0.3);
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .target-date {
      color: #aac8e4;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 1.6rem;
      font-weight: 300;
      border-bottom: 1px dashed rgba(255, 220, 140, 0.4);
      padding-bottom: 0.8rem;
      display: inline-block;
    }

    /* ---------- 倒數區塊：上排天，下排時分秒 ---------- */
    .countdown-grid {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.6rem;
    }

    .countdown-row-top {
      display: flex;
      justify-content: center;
    }

    .countdown-row-bottom {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
    }

    .time-block {
      background: #0d1a27;
      border-radius: 1.4rem;
      padding: 0.7rem 0.3rem;
      flex: 1 1 calc(33.333% - 0.6rem);
      min-width: 0;
      box-shadow: 0 12px 18px -8px black, 0 0 0 1px rgba(255, 210, 120, 0.2);
      border-bottom: 3px solid #ffbe4d;
    }

    /* 天數區塊：獨立一行，加寬置中 */
    .time-block.days-block {
      flex: 0 1 60%;
      min-width: 160px;
      max-width: 260px;
    }

    .time-value {
      font-size: 2rem;
      font-weight: 800;
      color: #ffe9b6;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 12px #f0b34b;
      letter-spacing: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .time-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #92adc9;
      margin-top: 0.3rem;
      font-weight: 400;
    }

    .age-section {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      background: rgba(10, 20, 30, 0.7);
      border-radius: 2rem;
      padding: 1rem 1rem;
      margin-bottom: 1rem;
      border: 1px solid rgba(255, 200, 100, 0.3);
    }

    .age-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1 1 auto;
    }

    .age-label {
      font-size: 0.75rem;
      color: #b8cfec;
      letter-spacing: 1px;
      margin-bottom: 0.2rem;
    }

    .age-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffd966;
      background: #162433;
      padding: 0.25rem 1rem;
      border-radius: 50px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.7), 0 0 0 1px #b88c3a;
      line-height: 1.2;
    }

    .age-note {
      font-size: 0.7rem;
      color: #97b3d0;
      margin-top: 0.2rem;
      font-style: italic;
    }

    .message {
      font-size: 0.95rem;
      color: #c9dbf0;
      margin-top: 1.2rem;
      padding-top: 0.9rem;
      border-top: 1px solid rgba(255, 210, 120, 0.3);
      letter-spacing: 0.5px;
      font-weight: 300;
    }

    .message strong {
      color: #ffd966;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .footnote {
      margin-top: 1.2rem;
      font-size: 0.7rem;
      color: #6e8aa8;
      letter-spacing: 0.5px;
    }

    /* ---------- 平板 / 桌面（min-width 往上加） ---------- */
    @media (min-width: 600px) {
      body {
        padding: 4rem 1.5rem 1.5rem;
        touch-action: auto;
      }
      .card {
        touch-action: auto;
        border-radius: 3.5rem;
        padding: 2.8rem 2.5rem;
      }
      h1 {
        font-size: 1.9rem;
        letter-spacing: 2px;
        gap: 10px;
      }
      .target-date {
        font-size: 0.95rem;
        letter-spacing: 2.5px;
        margin-bottom: 2rem;
        padding-bottom: 1rem;
      }
      .countdown-grid {
        gap: 0.9rem;
        margin-bottom: 2.2rem;
      }
      .countdown-row-bottom {
        gap: 0.9rem;
      }
      .time-block {
        border-radius: 1.8rem;
        padding: 0.8rem 0.4rem;
        flex: 1 1 85px;
        min-width: 85px;
        max-width: 160px;
      }
      .time-block.days-block {
        flex: 0 1 220px;
        min-width: 200px;
        max-width: 280px;
      }
      .time-value {
        font-size: 2.6rem;
        letter-spacing: 1px;
      }
      .time-label {
        font-size: 0.7rem;
        letter-spacing: 2px;
        margin-top: 0.4rem;
      }
      .age-section {
        gap: 1.8rem;
        border-radius: 60px;
        padding: 1rem 1.5rem;
      }
      .age-label {
        font-size: 0.8rem;
      }
      .age-value {
        font-size: 1.8rem;
        padding: 0.3rem 1.2rem;
      }
      .age-note {
        font-size: 0.75rem;
      }
      .message {
        font-size: 1rem;
        margin-top: 1.5rem;
        padding-top: 1rem;
      }
      .message strong {
        font-size: 1.2rem;
      }
      .footnote {
        margin-top: 1.5rem;
        font-size: 0.7rem;
      }
      .version-text {
        font-size: 0.75rem;
        letter-spacing: 1.2px;
        top: max(1rem, env(safe-area-inset-top) + 0.5rem);
        left: max(1rem, env(safe-area-inset-left) + 0.5rem);
      }
    }

    /* 極窄螢幕（320px 左右）再保險 */
    @media (max-width: 340px) {
      .card {
        padding: 1.2rem 0.8rem;
      }
      h1 {
        font-size: 1.3rem;
      }
      .time-value {
        font-size: 1.6rem;
      }
      .time-label {
        font-size: 0.65rem;
      }
      .age-value {
        font-size: 1.2rem;
      }
      .age-label, .age-note {
        font-size: 0.65rem;
      }
      .version-text {
        font-size: 0.6rem;
        top: max(0.5rem, env(safe-area-inset-top) + 0.3rem);
        left: max(0.5rem, env(safe-area-inset-left) + 0.3rem);
      }
    }
  </style>
</head>
<body>
  <!-- 左上角：版本 + 排版模式（absolute 定位，隨滾動移動，白字） -->
  <div class="version-text" id="versionText">v2.3.0 Mobile</div>

  <div class="card">
    <h1>⏳ 退休倒數</h1>
    <div class="target-date">2039年1月1日 · 退休日</div>

    <!-- 倒數計時區塊：上排天，下排時分秒 -->
    <div class="countdown-grid" id="countdown">
      <div class="countdown-row-top">
        <div class="time-block days-block">
          <div class="time-value" id="days">--</div>
          <div class="time-label">天</div>
        </div>
      </div>
      <div class="countdown-row-bottom">
        <div class="time-block">
          <div class="time-value" id="hours">--</div>
          <div class="time-label">小時</div>
        </div>
        <div class="time-block">
          <div class="time-value" id="minutes">--</div>
          <div class="time-label">分鐘</div>
        </div>
        <div class="time-block">
          <div class="time-value" id="seconds">--</div>
          <div class="time-label">秒</div>
        </div>
      </div>
    </div>

    <!-- 年齡顯示 -->
    <div class="age-section">
      <div class="age-item">
        <div class="age-label">現在年齡</div>
        <div class="age-value" id="currentAge">31</div>
        <div class="age-note">(1994/11/25 出生)</div>
      </div>
      <div class="age-item">
        <div class="age-label">退休時年齡</div>
        <div class="age-value" id="retireAge">44</div>
        <div class="age-note">(2039/01/01)</div>
      </div>
    </div>

    <div class="message" id="message">
      距離退休還有 <strong>--</strong> 天
    </div>
    <div class="footnote">⏱️ 倒數自動更新 · 每秒刷新</div>
  </div>

  <script>
    (function() {
      // ============================================================
      // 版本編號（每次改版時手動遞增）
      // ============================================================
      const VERSION = 'v2.3.0';

      // ============================================================
      // 左上角：版本 + 排版模式（單行文字，absolute 定位）
      // ============================================================
      const versionTextEl = document.getElementById('versionText');

      function updateVersionText() {
        const isDesktop = window.matchMedia('(min-width: 600px)').matches;
        const mode = isDesktop ? 'Desktop' : 'Mobile';
        versionTextEl.textContent = `${VERSION} ${mode}`;
      }

      updateVersionText();
      window.addEventListener('resize', updateVersionText);
      window.matchMedia('(min-width: 600px)').addEventListener('change', updateVersionText);

      // ============================================================
      // 手機版禁止雙擊縮放
      // ============================================================
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(event) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });

      document.addEventListener('gesturestart', function(event) {
        event.preventDefault();
      });

      // ============================================================
      // 倒數計時器
      // ============================================================
      if (window._retirementTimer) {
        clearInterval(window._retirementTimer);
        window._retirementTimer = null;
      }

      const RETIREMENT_DATE = new Date(2039, 0, 1, 0, 0, 0);
      // 出生日期：1994年11月25日（一出生為 0 歲，實歲計算）
      const BIRTH_DATE = new Date(1994, 10, 25);

      const daysEl = document.getElementById('days');
      const hoursEl = document.getElementById('hours');
      const minutesEl = document.getElementById('minutes');
      const secondsEl = document.getElementById('seconds');
      const currentAgeEl = document.getElementById('currentAge');
      const retireAgeEl = document.getElementById('retireAge');
      const messageEl = document.getElementById('message');

      // 實歲年齡：出生時 0 歲，滿生日才 +1
      function calculateAge(birthDate, referenceDate) {
        const birthYear = birthDate.getFullYear();
        const birthMonth = birthDate.getMonth();
        const birthDay = birthDate.getDate();

        const refYear = referenceDate.getFullYear();
        const refMonth = referenceDate.getMonth();
        const refDay = referenceDate.getDate();

        let age = refYear - birthYear;
        if (refMonth < birthMonth || (refMonth === birthMonth && refDay < birthDay)) {
          age--;
        }
        return age;
      }

      function updateAges() {
        const now = new Date();
        currentAgeEl.textContent = calculateAge(BIRTH_DATE, now);
        retireAgeEl.textContent = calculateAge(BIRTH_DATE, RETIREMENT_DATE);
      }

      function updateCountdown() {
        const now = new Date();
        let diff = RETIREMENT_DATE - now;

        if (diff <= 0) {
          daysEl.textContent = '0';
          hoursEl.textContent = '0';
          minutesEl.textContent = '0';
          secondsEl.textContent = '0';
          messageEl.innerHTML = `🎉 您已經退休了！享受人生吧！`;
          return;
        }

        const msPerSecond = 1000;
        const msPerMinute = 60 * msPerSecond;
        const msPerHour = 60 * msPerMinute;
        const msPerDay = 24 * msPerHour;

        const days = Math.floor(diff / msPerDay);
        diff -= days * msPerDay;

        const hours = Math.floor(diff / msPerHour);
        diff -= hours * msPerHour;

        const minutes = Math.floor(diff / msPerMinute);
        diff -= minutes * msPerMinute;

        const seconds = Math.floor(diff / msPerSecond);

        const daysStr = days.toString();
        if (daysStr.length >= 5) {
          daysEl.style.fontSize = '1.7rem';
        } else if (daysStr.length === 4) {
          daysEl.style.fontSize = '1.9rem';
        } else {
          daysEl.style.fontSize = '';
        }

        daysEl.textContent = days;
        hoursEl.textContent = String(hours).padStart(2, '0');
        minutesEl.textContent = String(minutes).padStart(2, '0');
        secondsEl.textContent = String(seconds).padStart(2, '0');

        const totalDays = Math.ceil((RETIREMENT_DATE - now) / msPerDay);
        messageEl.innerHTML = `距離退休還有 <strong>${totalDays.toLocaleString()}</strong> 天`;
      }

      function updateAll() {
        updateCountdown();
        updateAges();
      }

      updateAll();
      window._retirementTimer = setInterval(updateAll, 1000);
    })();
  </script>
</body>
</html>
